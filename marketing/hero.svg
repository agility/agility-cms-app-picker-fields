<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
	<title id="t">Picker Fields — icon and color pickers for Agility CMS</title>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
			<stop offset="0" stop-color="#1E293B" />
			<stop offset="1" stop-color="#0B1220" />
		</linearGradient>
		<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#334155" />
			<stop offset="1" stop-color="#0F172A" />
		</linearGradient>
	</defs>

	<rect width="1600" height="900" fill="url(#bg)" />

	<!-- app icon, same artwork as public/app-icon.svg -->
	<g transform="translate(640 150) scale(0.625)">
		<rect width="512" height="512" rx="114" fill="url(#tile)" />
		<rect x="78" y="70" width="150" height="150" rx="38" fill="#FFFFFF" opacity=".55" />
		<rect x="264" y="70" width="150" height="150" rx="38" fill="#FFFFFF" opacity=".30" />
		<rect x="78" y="256" width="150" height="150" rx="38" fill="#FFFFFF" opacity=".30" />
		<rect x="264" y="256" width="150" height="150" rx="38" fill="#FFFFFF" />
		<g transform="translate(300 268) scale(5.6)">
			<path d="M0 0 L0 18.6 L4.35 14.35 L7.45 21.2 L11 19.6 L7.9 13 L13.5 12.55 Z"
				fill="#0F172A" stroke="#FFFFFF" stroke-width="2.1" stroke-linejoin="round" />
		</g>
	</g>

	<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
		<text x="800" y="570" fill="#FFFFFF" font-size="86" font-weight="700" letter-spacing="-2">Picker Fields</text>
		<text x="800" y="632" fill="#94A3B8" font-size="31" font-weight="400">Icon and color pickers for Agility CMS</text>
	</g>

	<!-- the six field types -->
	<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
		font-size="21" font-weight="500" text-anchor="middle" fill="#CBD5E1">
		<g>
			<rect x="341" y="712" width="176" height="54" rx="27" fill="#FFFFFF" opacity=".08" />
			<text x="429" y="746">Lucide</text>
		</g>
		<g>
			<rect x="533" y="712" width="200" height="54" rx="27" fill="#FFFFFF" opacity=".08" />
			<text x="633" y="746">Heroicons</text>
		</g>
		<g>
			<rect x="749" y="712" width="248" height="54" rx="27" fill="#FFFFFF" opacity=".08" />
			<text x="873" y="746">Font Awesome</text>
		</g>
		<g>
			<rect x="1013" y="712" width="230" height="54" rx="27" fill="#FFFFFF" opacity=".08" />
			<text x="1128" y="746">Simple Icons</text>
		</g>
	</g>
	<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
		font-size="21" font-weight="500" text-anchor="middle" fill="#CBD5E1">
		<g>
			<rect x="620" y="782" width="158" height="54" rx="27" fill="#FFFFFF" opacity=".08" />
			<text x="699" y="816">Hex color</text>
		</g>
		<g>
			<rect x="794" y="782" width="186" height="54" rx="27" fill="#FFFFFF" opacity=".08" />
			<text x="887" y="816">Named color</text>
		</g>
	</g>
</svg>
