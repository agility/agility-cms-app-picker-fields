<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t">
	<title id="t">The named color field, listing the CSS named colors ordered by appearance</title>

	<style>
		.ui { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, system-ui, sans-serif; }
		.nm { font-size: 19px; fill: #64748B; }
	</style>

	<rect width="1600" height="1000" fill="#F1F5F9" />
	<rect x="420" y="80" width="760" height="840" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

	<g class="ui">
		<text x="460" y="152" font-size="24" font-weight="500" fill="#334155">Accent color</text>

		<rect x="460" y="172" width="680" height="640" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

		<!-- the collapsed row -->
		<rect x="484" y="196" width="72" height="72" rx="10" fill="#008080" stroke="#CBD5E1" stroke-width="2" />
		<text x="578" y="226" font-size="29" font-weight="500" fill="#0F172A">teal</text>
		<text x="578" y="256" font-size="22" fill="#64748B">#008080</text>

		<text x="1000" y="241" font-size="24" font-weight="500" fill="#64748B" text-anchor="middle">Clear</text>
		<rect x="1040" y="206" width="80" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
		<text x="1080" y="241" font-size="24" font-weight="500" fill="#334155" text-anchor="middle">Done</text>

		<line x1="460" y1="292" x2="1140" y2="292" stroke="#E2E8F0" stroke-width="2" />

		<!-- search -->
		<rect x="484" y="316" width="632" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
		<text x="506" y="354" font-size="24" fill="#94A3B8">Search color names…</text>

		<!-- the grid, greys first then walking the spectrum, as the field orders them -->
		<g>
			<!-- row 1 -->
			<rect x="484" y="408" width="97" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
			<text x="532" y="486" class="nm" text-anchor="middle">white</text>
			<rect x="591" y="408" width="97" height="56" rx="8" fill="#F5F5F5" />
			<text x="639" y="486" class="nm" text-anchor="middle">whitesmoke</text>
			<rect x="698" y="408" width="97" height="56" rx="8" fill="#DCDCDC" />
			<text x="746" y="486" class="nm" text-anchor="middle">gainsboro</text>
			<rect x="805" y="408" width="97" height="56" rx="8" fill="#C0C0C0" />
			<text x="853" y="486" class="nm" text-anchor="middle">silver</text>
			<rect x="912" y="408" width="97" height="56" rx="8" fill="#808080" />
			<text x="960" y="486" class="nm" text-anchor="middle">gray</text>
			<rect x="1019" y="408" width="97" height="56" rx="8" fill="#000000" />
			<text x="1067" y="486" class="nm" text-anchor="middle">black</text>

			<!-- row 2 -->
			<rect x="484" y="504" width="97" height="56" rx="8" fill="#DC143C" />
			<text x="532" y="582" class="nm" text-anchor="middle">crimson</text>
			<rect x="591" y="504" width="97" height="56" rx="8" fill="#FF6347" />
			<text x="639" y="582" class="nm" text-anchor="middle">tomato</text>
			<rect x="698" y="504" width="97" height="56" rx="8" fill="#FF7F50" />
			<text x="746" y="582" class="nm" text-anchor="middle">coral</text>
			<rect x="805" y="504" width="97" height="56" rx="8" fill="#FFA500" />
			<text x="853" y="582" class="nm" text-anchor="middle">orange</text>
			<rect x="912" y="504" width="97" height="56" rx="8" fill="#FFD700" />
			<text x="960" y="582" class="nm" text-anchor="middle">gold</text>
			<rect x="1019" y="504" width="97" height="56" rx="8" fill="#F0E68C" />
			<text x="1067" y="582" class="nm" text-anchor="middle">khaki</text>

			<!-- row 3 -->
			<rect x="484" y="600" width="97" height="56" rx="8" fill="#9ACD32" />
			<text x="532" y="678" class="nm" text-anchor="middle">yellowgreen</text>
			<rect x="591" y="600" width="97" height="56" rx="8" fill="#32CD32" />
			<text x="639" y="678" class="nm" text-anchor="middle">limegreen</text>
			<rect x="698" y="600" width="97" height="56" rx="8" fill="#2E8B57" />
			<text x="746" y="678" class="nm" text-anchor="middle">seagreen</text>

			<!-- the selection -->
			<rect x="801" y="596" width="105" height="64" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
			<rect x="809" y="604" width="89" height="48" rx="6" fill="#008080" />
			<text x="853" y="678" class="nm" fill="#0F172A" font-weight="600" text-anchor="middle">teal</text>

			<rect x="912" y="600" width="97" height="56" rx="8" fill="#40E0D0" />
			<text x="960" y="678" class="nm" text-anchor="middle">turquoise</text>
			<rect x="1019" y="600" width="97" height="56" rx="8" fill="#00BFFF" />
			<text x="1067" y="678" class="nm" text-anchor="middle">deepskyblue</text>

			<!-- row 4 -->
			<rect x="484" y="696" width="97" height="56" rx="8" fill="#4682B4" />
			<text x="532" y="774" class="nm" text-anchor="middle">steelblue</text>
			<rect x="591" y="696" width="97" height="56" rx="8" fill="#4169E1" />
			<text x="639" y="774" class="nm" text-anchor="middle">royalblue</text>
			<rect x="698" y="696" width="97" height="56" rx="8" fill="#000080" />
			<text x="746" y="774" class="nm" text-anchor="middle">navy</text>
			<rect x="805" y="696" width="97" height="56" rx="8" fill="#DA70D6" />
			<text x="853" y="774" class="nm" text-anchor="middle">orchid</text>
			<rect x="912" y="696" width="97" height="56" rx="8" fill="#FF69B4" />
			<text x="960" y="774" class="nm" text-anchor="middle">hotpink</text>
			<rect x="1019" y="696" width="97" height="56" rx="8" fill="#F5DEB3" />
			<text x="1067" y="774" class="nm" text-anchor="middle">wheat</text>
		</g>
	</g>

	<text x="800" y="868" class="ui" font-size="25" fill="#64748B" text-anchor="middle">
		All 148 CSS named colors, ordered by appearance so the blues sit together.
	</text>
</svg>
