<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
	<title id="t">Picker Fields</title>
	<desc id="d">A cursor selecting one tile from a four-tile palette.</desc>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#334155" />
			<stop offset="1" stop-color="#0F172A" />
		</linearGradient>
	</defs>

	<rect width="512" height="512" rx="114" fill="url(#bg)" />

	<!-- The palette: a grid with one tile picked, mirroring what both pickers
	     actually look like — a grid with a ring on the selection. -->
	<g>
		<rect x="78" y="70" width="150" height="150" rx="38" fill="#FFFFFF" opacity=".55" />
		<rect x="264" y="70" width="150" height="150" rx="38" fill="#FFFFFF" opacity=".30" />
		<rect x="78" y="256" width="150" height="150" rx="38" fill="#FFFFFF" opacity=".30" />
		<rect x="264" y="256" width="150" height="150" rx="38" fill="#FFFFFF" />
	</g>

	<!-- Cursor, tip resting on the picked tile. The white stroke keeps it legible
	     where it crosses from the white tile onto the dark ground. -->
	<g transform="translate(300 268) scale(5.6)">
		<path
			d="M0 0 L0 18.6 L4.35 14.35 L7.45 21.2 L11 19.6 L7.9 13 L13.5 12.55 Z"
			fill="#0F172A"
			stroke="#FFFFFF"
			stroke-width="2.1"
			stroke-linejoin="round"
		/>
	</g>
</svg>
